variables:
  - &DOCKER_IMAGE_NAME gedcom-website
  - &ARCHIVE_NAME gedcom-website.tar.gz

when:
  - event: [push, pull_request, tag, manual]
    branch: [main, develop]

steps:

  - name: Build
    image: docker:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_IMAGE_NAME: *DOCKER_IMAGE_NAME
      ARCHIVE_NAME: *ARCHIVE_NAME
    commands:
      - echo "📦 Installation de gzip et docker-cli"
      - apk add --no-cache docker-cli gzip

      - echo "🔧 Build de l'image Docker $DOCKER_IMAGE_NAME"
      - docker build -t $DOCKER_IMAGE_NAME .

      - echo "💾 Sauvegarde de l'image Docker dans un fichier $ARCHIVE_NAME"
      - docker save $DOCKER_IMAGE_NAME | gzip > $ARCHIVE_NAME

  #    - echo "📁 Vérification du fichier local :"
  #    - ls -lh $ARCHIVE_NAME
  #    - cp $ARCHIVE_NAME test2.tar.gz
  #    - gunzip test2.tar.gz
  #    - tar -tf test2.tar | head


  - name: Copy on remote
    image: alpine:latest
    environment:
      DOCKER_IMAGE_NAME: *DOCKER_IMAGE_NAME
      ARCHIVE_NAME: *ARCHIVE_NAME
      SSH_HOST:
        from_secret: SSH_HOST
      SSH_PORT:
        from_secret: SSH_PORT
      SSH_KEY:
        from_secret: SSH_KEY
    commands:
      - echo "🔐 Préparation SSH"
      - apk add --no-cache openssh
      - mkdir -p /root/.ssh
      - echo "$SSH_KEY" > /root/.ssh/id_rsa
      - chmod 600 /root/.ssh/id_rsa
      - ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> /root/.ssh/known_hosts

      - echo "🔌 Test de connexion SSH"
      - ssh -p $SSH_PORT root@$SSH_HOST "echo '✅ Connexion SSH réussie !'"

      - echo "📤 Transfert du fichier vers le serveur distant"
      - scp -P $SSH_PORT $ARCHIVE_NAME root@$SSH_HOST:/tmp/$ARCHIVE_NAME

      - echo "📂 Vérification du fichier sur le serveur distant"
      - ssh -p $SSH_PORT root@$SSH_HOST "ls -lh /tmp/$ARCHIVE_NAME"

      - echo "📥 Importation de l image Docker sur le serveur distant"
      - ssh -p $SSH_PORT root@$SSH_HOST "docker load < /tmp/$ARCHIVE_NAME"
